<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070609">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>ЧЕТВЕРО</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 40%, #171020 0%, #09070c 45%, #030304 100%);
  color: #e9e5ef;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.app {
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.logo {
  position: relative;
  margin: 0 auto 22px;
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #352344;
  border-radius: 35px;
  background: linear-gradient(145deg, #100b17, #050406);
  box-shadow: 0 0 45px rgba(120, 45, 190, 0.12);
}

.logo span {
  font-size: 100px;
  font-weight: 200;
  line-height: 1;
  color: #dcd3e9;
  text-shadow: 0 0 25px rgba(160, 90, 255, 0.45);
}

.crown {
  position: absolute;
  top: 14px;
  font-size: 22px;
  color: #9b68d0;
}

h1 {
  font-size: 34px;
  font-weight: 500;
  letter-spacing: 9px;
  margin-left: 9px;
}

.subtitle {
  margin-top: 12px;
  color: #77717f;
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.line {
  width: 45px;
  height: 1px;
  background: #69428b;
  margin: 35px auto;
}

input {
  width: 100%;
  padding: 17px;
  background: #100d14;
  border: 1px solid #302637;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  outline: none;
  text-align: center;
}

input:focus {
  border-color: #8452ae;
  box-shadow: 0 0 15px #54277930;
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 17px;
  border: 1px solid #5e3b7d;
  border-radius: 12px;
  background: linear-gradient(110deg, #21152d, #382047);
  color: #eee7f7;
  font-size: 15px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: 0.25s;
}

button:active {
  transform: scale(0.98);
  background: #4b2d63;
}

.note {
  margin-top: 20px;
  color: #55505c;
  font-size: 12px;
}

#message {
  margin-top: 25px;
  color: #b99bd5;
  font-size: 14px;
  line-height: 1.6;
}

.footer {
  position: fixed;
  bottom: 20px;
  color: #39343e;
  font-size: 10px;
  letter-spacing: 3px;
}
</style>
</head>

<body>
<main class="app">
  <div class="logo">
    <div class="crown">♛</div>
    <span>4</span>
  </div>

  <h1>ЧЕТВЕРО</h1>
  <p class="subtitle">Только свои. Никаких правил.</p>

  <div class="line"></div>

  <input
    id="nickname"
    type="text"
    maxlength="24"
    placeholder="Твой никнейм"
    autocomplete="nickname"
  >

  <button onclick="enterGame()">ВОЙТИ</button>

  <p class="note">Без регистрации · Только для друзей</p>
  <div id="message"></div>
</main>

<div class="footer">ЧЕТВЕРО · PRIVATE GAME</div>

<script>
function enterGame() {
  const nickname = document.getElementById("nickname").value.trim();
  const message = document.getElementById("message");

  if (!nickname) {
    message.textContent = "Сначала введи свой никнейм.";
    return;
  }

  localStorage.setItem("chetvero_nickname", nickname);
  message.textContent = "Добро пожаловать, " + nickname + ". ЧЕТВЕРО начинается.";
}
</script>
</body>
</html>
