<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ЧЕТВЕРО</title>

<style>
:root{
  --bg:#08070b;
  --panel:#121017;
  --panel2:#19141f;
  --text:#f3eff7;
  --muted:#8d8497;
  --accent:#9c65ff;
  --accent2:#572c91;
  --border:#292230;
  --danger:#a83b4a;
}
*{box-sizing:border-box}
body{
  margin:0;background:
  radial-gradient(ellipse at top,#20142c 0%,#08070b 48%,#050407 100%);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:var(--text)}
.app{max-width:600px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px 95px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px}
.brand{font-weight:900;letter-spacing:4px;font-size:15px}
.brand span{display:block;font-size:8px;color:var(--muted);letter-spacing:2px;margin-top:4px}
button{border:0}
.ghost{background:#211a29;border:1px solid var(--border);border-radius:12px;padding:10px}
.hero{text-align:center;padding:20px 0 24px}
.logo{height:90px;width:90px;border:1px solid #6b438f;border-radius:25px;margin:0 auto 16px;
display:grid;place-items:center;position:relative;box-shadow:0 0 35px #7a35bb22}
.logo b{font-size:54px;font-weight:300}
.logo i{position:absolute;top:5px;font-size:14px;color:var(--accent)}
h1{font-size:29px;letter-spacing:7px;margin:0 0 8px}
.hero p{color:var(--muted);font-size:13px}
#hello{color:#c7a8ff;font-size:13px;margin-top:12px}
.card,.panel{background:linear-gradient(145deg,#17121d,#0f0d13);border:1px solid var(--border);border-radius:18px;padding:16px;margin:14px 0}
label{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:9px}
input,textarea,select{width:100%;background:#09080c;border:1px solid #332a3b;border-radius:11px;padding:13px;color:white;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.line{display:flex;gap:8px}
.line button,.action{background:var(--accent2);padding:12px 16px;border-radius:11px;font-weight:700}
small,.muted{color:var(--muted);font-size:11px}
.card small{display:block;margin-top:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:112px;text-align:left;background:linear-gradient(145deg,#19141f,#100d14);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:7px}
.tile b{font-size:24px;color:#c09aff}
.tile strong{font-size:14px}
.tile small{font-size:11px}
.tile.primary{border-color:#7045a0;background:linear-gradient(145deg,#271735,#120d19)}
.panel h2{font-size:20px;margin:0 0 14px}
.panel h3{font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:grid;gap:10px}
.btn{width:100%;padding:14px;border-radius:12px;background:#211a29;border:1px solid var(--border);font-weight:700;margin-top:8px}
.btn.primary{background:linear-gradient(120deg,#6735a1,#3a205e);border-color:#8b5dc1}
.btn.red{background:#411821;border-color:#71303d}
.btn:disabled{opacity:.35}
.option{display:flex;align-items:center;gap:10px;padding:12px;background:#0b090e;border:1px solid var(--border);border-radius:12px;margin:7px 0}
.option input{width:auto}
.player{display:flex;justify-content:space-between;align-items:center;background:#0c0a10;border:1px solid var(--border);border-radius:12px;padding:12px;margin:7px 0}
.avatar{width:38px;height:38px;border-radius:12px;background:#2a1d37;display:grid;place-items:center;color:#c9a5ff;font-size:18px}
.player-info{display:flex;align-items:center;gap:10px}
.code{font-size:28px;letter-spacing:8px;text-align:center;color:#c8a5ff;font-weight:900}
.question{font-size:22px;line-height:1.45;text-align:center;padding:24px 5px}
.tag{display:inline-block;padding:5px 9px;border:1px solid #49335b;border-radius:20px;color:#c5a2f7;font-size:10px}
.message{background:#17121d;border-radius:12px;padding:10px;margin:8px 0;max-width:85%}
.message.mine{margin-left:auto;background:#38224d}
nav{position:fixed;bottom:0;left:0;right:0;background:#09070cee;backdrop-filter:blur(15px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center;font-size:19px}
nav small{font-size:9px}
nav button.active{color:#c09aff}
.hidden{display:none!important}
#toast{position:fixed;bottom:100px;left:20px;right:20px;text-align:center;background:#30213e;padding:12px;border-radius:12px;display:none;z-index:10}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>

<body>
<div class="app">
<header>
<div class="brand">ЧЕТВЕРО<span>PRIVATE GAME · 18+</span></div>
<button class="ghost" onclick="toggleAccent()">◐</button>
</header>

<main id="main">
<section class="hero">
<div class="logo"><i>♛</i><b>4</b></div>
<h1>ЧЕТВЕРО</h1>
<p>Только свои. Никаких правил.</p>
<div id="hello"></div>
</section>

<section class="card">
<label>ТВОЙ НИКНЕЙМ</label>
<div class="line"><input id="nickname" maxlength="24" placeholder="Введите никнейм"><button class="action" onclick="saveNick()">OK</button></div>
<small>Гостевой профиль · данные сохраняются на устройстве</small>
</section>

<div class="grid">
<button class="tile primary" onclick="createRoom()"><b>＋</b><strong>Создать комнату</strong><small>Начать свою игру</small></button>
<button class="tile" onclick="joinRoom()"><b>⌁</b><strong>Войти по коду</strong><small>Присоединиться</small></button>
<button class="tile" onclick="showFriends()"><b>♧</b><strong>Друзья</strong><small>Игроки и приглашения</small></button>
<button class="tile" onclick="showChats()"><b>◌</b><strong>Чаты</strong><small>Сообщения</small></button>
<button class="tile" onclick="showProfile()"><b>◉</b><strong>Профиль</strong><small>Статистика</small></button>
<button class="tile" onclick="showRules()"><b>☷</b><strong>Правила</strong><small>Как играть</small></button>
</div>
<section id="panel" class="panel hidden"></section>
</main>
</div>

<nav>
<button class="active" onclick="home()">⌂<small>Главная</small></button>
<button onclick="showFriends()">♧<small>Друзья</small></button>
<button onclick="showChats()">◌<small>Чаты</small></button>
<button onclick="showProfile()">◉<small>Профиль</small></button>
</nav>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let nick=get("chetvero_nick","Слава");
let room=get("chetvero_room",null);
let accent=get("chetvero_accent",0);
let game=get("chetvero_game",null);
let messages=get("chetvero_messages",[]);
let friends=get("chetvero_friends",[]);
let categories=["18+ и интим","Девушки и знакомства","Отношения и бывшие","Тайны и признания","Провокационные","Дружба и компания","Алкоголь и вечеринки","Неловкие ситуации","Гипотетические","Чёрный юмор","Деньги и амбиции","Детство и прошлое"];
let questions=[
["Кому из компании ты доверил бы самый большой секрет?","Какой поступок ты скрываешь от большинства?","Что ты никогда не рассказал бы родителям?"],
["Кто из вас лучше всех знакомится?","Какой самый странный повод был у твоего расставания?","Ты когда-нибудь врал человеку, чтобы понравиться?"],
["Ты проверял телефон бывшей?","Кого из бывших ты вспоминаешь чаще всего?","Что было самым токсичным в твоих отношениях?"],
["Какой секрет о тебе удивит остальных?","За что тебе до сих пор стыдно?","Какую ложь ты поддерживал дольше всего?"],
["Кто в компании самый опасный в конфликте?","Кому ты завидуешь и почему?","Какой вопрос ты боишься услышать сегодня?"],
["Кто из друзей первым предаст ради денег?","Кого ты бы не взял в путешествие?","Кто лучше всех умеет хранить секреты?"],
["Самая безумная ночь в твоей жизни?","Ты когда-нибудь терял телефон после вечеринки?","Кто из компании хуже всех переносит алкоголь?"],
["Самый позорный момент на публике?","Какое сообщение ты отправил не тому человеку?","Какой у тебя самый странный страх?"],
["Если бы можно было стереть один поступок — какой?","Если бы завтра ты стал знаменитым, за что?","С кем из компании поменялся бы жизнью на неделю?"],
["Кто из вас выживет в апокалипсисе последним?","Какой самый мрачный юмор тебе нравится?","Кто в компании выглядит подозрительнее всех?"],
["Сколько денег ты хотел бы зарабатывать через 5 лет?","Что ты сделал бы за миллион рублей?","Кто из друзей станет самым богатым?"],
["Какое воспоминание из детства тебя до сих пор преследует?","Кем ты хотел стать в детстве?","Какой поступок из прошлого ты бы изменил?"]
];
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2300)}
function saveNick(){nick=$("nickname").value.trim()||nick;set("chetvero_nick",nick);$("nickname").value=nick;hello();toast("Никнейм сохранён")}
function hello(){$("hello").textContent="Добро пожаловать, "+nick}
$("nickname").value=nick;hello();
function toggleAccent(){accent=(accent+1)%3;set("chetvero_accent",accent);document.documentElement.style.setProperty("--accent",["#9c65ff","#c43d4d","#7777ff"][accent]);toast("Тема изменена")}
function panel(html){$("panel").innerHTML=html;$("panel").classList.remove("hidden");$("panel").scrollIntoView({behavior:"smooth",block:"start"})}
function home(){$("panel").classList.add("hidden")}
function createRoom(){
room={code:Math.random().toString(36).slice(2,7).toUpperCase(),name:"Комната "+nick,players:[nick],creator:nick,permanent:true};
set("chetvero_room",room);
panel(`<h2>Комната создана</h2><p class="muted">Код приглашения</p><div class="code">${room.code}</div><button class="btn" onclick="copyCode()">Копировать код</button><h3>Игроки</h3><div id="players"></div><button class="btn primary" onclick="settings()">Настроить игру</button><button class="btn" onclick="addDemo()">Добавить игрока (демо)</button><button class="btn" onclick="home()">На главную</button>`);
renderPlayers()
}
function copyCode(){if(navigator.clipboard)navigator.clipboard.writeText(room.code);toast("Код: "+room.code)}
function addDemo(){let n=prompt("Никнейм игрока");if(n){room.players.push(n);set("chetvero_room",room);renderPlayers()}}
function renderPlayers(){let p=$("players");if(p)p.innerHTML=room.players.map(x=>`<div class="player"><span>${x}</span><span class="tag">${x===room.creator?"Создатель":"Игрок"}</span></div>`).join("")}
function joinRoom(){let c=prompt("Введите код комнаты");if(!c)return;let saved=get("chetvero_room",null);if(saved&&saved.code===c.toUpperCase()){room=saved;if(!room.players.includes(nick))room.players.push(nick);set("chetvero_room",room);createRoom();toast("Вы вошли в комнату")}else toast("Комната не найдена в демо-режиме")}
function settings(){
if(!room){toast("Сначала создайте комнату");return}
panel(`<h2>Настройки игры</h2><label>КОЛИЧЕСТВО РАУНДОВ</label><select id="rounds"><option>5</option><option>10</option><option>15</option><option>20</option></select><label>СЛОЖНОСТЬ</label><select id="difficulty"><option>Лёгкая</option><option selected>Средняя</option><option>Жёсткая</option></select><label>СПОСОБ ГОЛОСОВАНИЯ</label><select id="voting"><option>Все кроме отвечающего</option><option>Выбранный судья</option><option>Анонимное</option></select><h3>Категории (выберите до 5)</h3><div id="cats">${categories.map((c,i)=>`<label class="option"><input type="checkbox" value="${i}" checked> ${c}</label>`).join("")}</div><button class="btn primary" onclick="startGame()">Начать игру</button><button class="btn" onclick="createRoom()">Назад</button>`)
}
function startGame(){
let selected=[...document.querySelectorAll("#cats input:checked")].map(x=>+x.value);
if(!selected.length){toast("Выберите категории");return}
game={round:1,total:+$("rounds").value,difficulty:$("difficulty").value,voting:$("voting").value,cats:selected,turn:0,score:{},used:[],answers:[]};
room.players.forEach(p=>game.score[p]=0);set("chetvero_game",game);nextTurn()
}
function nextTurn(){
if(game.round>game.total){finish();return}
let player=room.players[game.turn%room.players.length];
let ci=game.cats[Math.floor(Math.random()*game.cats.length)];
let available=questions[ci].filter(q=>!game.used.includes(q));
if(!available.length)available=questions[ci];
let q=available[Math.floor(Math.random()*available.length)];
game.used.push(q);set("chetvero_game",game);
panel(`<div class="row"><span class="tag">РАУНД ${game.round}/${game.total}</span><span class="tag">${game.difficulty}</span></div><h2 style="text-align:center">${player}</h2><p class="muted" style="text-align:center">ТВОЙ ВОПРОС</p><div class="question">${q}</div><textarea id="answer" rows="3" placeholder="Напиши ответ…"></textarea><button class="btn primary" onclick="submitAnswer()">Я ответил</button><button class="btn" onclick="skipQuestion()">Пропустить (−1)</button><button class="btn" onclick="showScore()">Таблица очков</button>`)
}
function submitAnswer(){let a=$("answer").value.trim();if(!a){toast("Введите ответ");return}game.answers.push({player:room.players[game.turn%room.players.length],answer:a});set("chetvero_game",game);vote()}
function skipQuestion(){let p=room.players[game.turn%room.players.length];game.score[p]=(game.score[p]||0)-1;game.turn++;advanceRound();nextTurn()}
function vote(){
let p=room.players[game.turn%room.players.length];
let choices=room.players.filter(x=>x!==p);
panel(`<h2>Голосование</h2><p class="muted">Кто заслуживает очко за ответ?</p>${choices.map(x=>`<button class="btn" onclick="castVote('${x.replace(/'/g,"")}')">${x}</button>`).join("")}<button class="btn" onclick="castVote('skip')">Не голосовать</button>`)
}
function castVote(v){if(v!=="skip")game.score[v]=(game.score[v]||0)+1;game.turn++;advanceRound();showScore()}
function advanceRound(){if(game.turn%room.players.length===0)game.round++;set("chetvero_game",game)}
function showScore(){panel(`<h2>Таблица очков</h2>${Object.entries(game.score).map(([p,s])=>`<div class="player"><span>${p}</span><strong>${s}</strong></div>`).join("")}<button class="btn primary" onclick="nextTurn()">Следующий ход</button>`)}
function finish(){let sorted=Object.entries(game.score).sort((a,b)=>b[1]-a[1]);panel(`<h2>Игра окончена</h2><div class="question">♛ ${sorted[0][0]} победил!</div>${sorted.map(([p,s])=>`<div class="player">${p}<b>${s} очков</b></div>`).join("")}<button class="btn primary" onclick="settings()">Реванш</button><button class="btn" onclick="home()">В комнату</button>`)}
function showFriends(){panel(`<h2>Друзья</h2><p class="muted">Добавляй друзей по никнейму</p><div class="line"><input id="friendName" placeholder="Никнейм друга"><button class="action" onclick="addFriend()">Добавить</button></div><div id="friendList">${friends.map(f=>`<div class="player">${f}<span class="tag">offline</span></div>`).join("")}</div><p class="muted">В демо-версии друзья сохраняются локально.</p>`)}
function addFriend(){let f=$("friendName").value.trim();if(!f)return;friends.push(f);set("chetvero_friends",friends);showFriends();toast("Добавлен в список")}
function showChats(){panel(`<h2>Чаты</h2><p class="muted">Демо-чат на этом устройстве</p><div id="chat">${messages.map(m=>`<div class="message ${m.n===nick?"mine":""}"><small>${m.n}</small><br>${escapeHtml(m.t)}</div>`).join("")}</div><div class="line"><input id="msg" placeholder="Сообщение"><button class="action" onclick="sendMessage()">➤</button></div>`)}
function sendMessage(){let t=$("msg").value.trim();if(!t)return;messages.push({n:nick,t});set("chetvero_messages",messages);showChats()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showProfile(){panel(`<h2>Профиль</h2><div class="player"><div class="player-info"><div class="avatar">♛</div><strong>${nick}</strong></div><span class="tag">Гость</span></div><p>Игр сыграно: ${get("chetvero_games",0)}</p><p>Достижения: пока нет</p><button class="btn" onclick="saveNick()">Обновить ник</button>`)}
function showRules(){panel(`<h2>Правила</h2><p>Игроки по очереди получают вопросы. Ответьте честно или пропустите вопрос за штрафное очко. После ответа остальные голосуют. В конце раундов победитель определяется по очкам.</p><p class="muted">Играйте только с согласия участников. Любой игрок может отказаться от вопроса.</p><button class="btn" onclick="home()">Понятно</button>`)}
function home(){ $("panel").classList.add("hidden")}
</script>
</body>
</html>
